<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=, initial-scale=1.0">
  <title>MMUST SHOP</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #17324d;
    }

    table {
      width: min(90%, 700px);
      border-collapse: collapse;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(23, 50, 77, 0.12);
    }
    td {
      padding: 3rem 1.5rem;
      text-align: center;
      border-top: 6px solid #080808;
    }

    h1 {
      margin: 0;
      color: #0b6e4f;
      letter-spacing: 0.08em;
    }

    p {
      margin: 0.5rem 0 0;
      color: #52606d;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <table> 
    <td align="center" bordercolor="blakk" bgcolor="white" width="100%" height="100%">
      <h1>MMUST  SHOP</h1>
      <P>BUY & SELL</P>
      <p>ANYTHING</p>
    </td>
  </table>
</body>
</html>
